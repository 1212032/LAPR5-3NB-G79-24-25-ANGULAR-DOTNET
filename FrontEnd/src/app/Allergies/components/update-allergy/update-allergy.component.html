<div class="main-content">
    <div class="header">
        <h1>Update allergy</h1>
    </div>
    <div class="summary">
        <div class="my-2">
            <div class="allergy-form-container">
                <form class="allergy-form" [formGroup]="allergyForm">
                    <div class="mb-3 code">
                        <label for="code">Code:</label>
                        <input class="form-control" type="text" id="code" formControlName="code" />
                    </div>
                    <div class="mb-3 name">
                        <label for="name">Name:</label>
                        <input class="form-control" type="text" id="name" formControlName="name" />
                    </div>
                    <div class="mb-3 description">
                        <label for="description">Description:</label>
                        <textarea class="form-control" type="text" id="description" formControlName="description" rows="10"></textarea>
                    </div>                    

                    <button type="submit" class="btn btn-danger" (click)="updateAllergy()">
                        Submit
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
