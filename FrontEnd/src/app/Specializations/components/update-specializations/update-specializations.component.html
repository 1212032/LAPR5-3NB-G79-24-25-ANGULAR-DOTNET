<div class="main-content">
  <div class="header">
    <h1>Update Specialization</h1>
  </div>

  <div class="summary">
    <div class="specialization-form-container">
      <form [formGroup]="updateForm" (ngSubmit)="updateSpecialization()">
        <div class="form-group">
          <label for="code">Code:</label>
          <input
            type="text"
            id="code"
            formControlName="code"
            class="form-control"
            placeholder="Enter Specialization Code"
          />
          <div *ngIf="updateForm.get('code')?.invalid && updateForm.get('code')?.touched" class="error-message">
            Code is required and must be at least 3 characters long.
          </div>
        </div>

        <div class="form-group">
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            class="form-control"
            placeholder="Enter Specialization Name"
          />
          <div *ngIf="updateForm.get('name')?.invalid && updateForm.get('name')?.touched" class="error-message">
            Name is required and must be at least 3 characters long.
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description:</label>
          <textarea
            id="description"
            formControlName="description"
            class="form-control"
            placeholder="Enter Specialization Description"
          ></textarea>
          <div *ngIf="updateForm.get('description')?.invalid && updateForm.get('description')?.touched" class="error-message">
            Description is required and cannot exceed 200 characters.
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Update Specialization</button>
      </form>
    </div>
  </div>
</div>
