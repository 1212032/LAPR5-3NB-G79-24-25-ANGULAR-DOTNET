<div class="main-content">
    <div class="header">
        <h1>Create room</h1>
    </div>
    <div class="summary">
        <div class="my-2">
            <div class="room-form-container">
                <form class="room-form" [formGroup]="roomForm">
                    <div class="mb-3 code">
                        <label for="code">Code:</label>
                        <input #input class="form-control" type="text" id="code" formControlName="code" maxlength="8" />
                    </div>
                    <div class="mb-3 name">
                        <label for="name">Name:</label>
                        <input class="form-control" type="text" id="name" formControlName="name" />
                    </div>
                    <div class="mb-3 description">
                        <label for="description">Description:</label>
                        <textarea class="form-control" type="text" id="description" formControlName="description"
                            rows="4"></textarea>
                    </div>
                    <div class="mb-3 forSurgery">
                        <input class="form-check-input" type="checkbox" value="true" id="forSurgery"
                            formControlName="forSurgery" style="margin-top: 10px;" checked>
                        <label class="form-check-label" for="forSurgery" style="margin-top: 6px; margin-left: 10px;">For
                            surgery</label>
                    </div>
                    <button type="submit" class="btn btn-danger" (click)="createSurgeryRoom()">
                        Submit
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
