<div class="main-content">
    <div class="header">
        <h1>{{title}}</h1>
    </div>

    <div class="summary">
        <div class="my-2">
            <div class="patient-form-container">
                <form [formGroup]="patientForm" (ngSubmit)="updatePatient()">
                    <div class="mb-3">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" formControlName="firstName" class="form-control"
                            [readonly]="!canUpdate()" placeholder="Enter First Name" />
                        <div *ngIf="patientForm.get('firstName')?.invalid && patientForm.get('firstName')?.touched"
                            class="error-message">
                            First Name is required.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" formControlName="lastName" class="form-control"
                            [readonly]="!canUpdate()" placeholder="Enter Last Name" />
                        <div *ngIf="patientForm.get('lastName')?.invalid && patientForm.get('lastName')?.touched"
                            class="error-message">
                            Last Name is required.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="gender">Gender:</label>
                        <select id="gender" formControlName="gender" class="form-select">
                            <option value="" disabled>Select Gender</option>
                            <option value="Man" [disabled]="!canUpdate()">Man</option>
                            <option value="Woman" [disabled]="!canUpdate()">Woman</option>
                        </select>
                        <div *ngIf="patientForm.get('gender')?.invalid && patientForm.get('gender')?.touched"
                            class="error-message">
                            Gender is required.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="dateOfBirth">Date of Birth:</label>
                        <input type="date" max="2999-12-31" id="dateOfBirth" formControlName="dateOfBirth"
                            [readonly]="!canUpdate()" class="form-control" />
                        <div *ngIf="patientForm.get('dateOfBirth')?.invalid && patientForm.get('dateOfBirth')?.touched"
                            class="error-message">
                            Date of Birth is required.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address">Address:</label>
                        <input type="text" id="address" formControlName="address" class="form-control"
                            [readonly]="!canUpdate()" placeholder="Enter Address" />
                        <div *ngIf="patientForm.get('address')?.invalid && patientForm.get('address')?.touched"
                            class="error-message">
                            Address is required.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="phone">Phone:</label>
                        <input type="text" id="phone" formControlName="phone" class="form-control"
                            [readonly]="!canUpdate()" placeholder="Enter Phone Number" />
                        <div *ngIf="patientForm.get('phone')?.invalid && patientForm.get('phone')?.touched"
                            class="error-message">
                            Phone is required.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email">Email:</label>
                        <input type="email" id="email" formControlName="email" class="form-control"
                            [readonly]="!canUpdate()" placeholder="Enter Email" />
                        <div *ngIf="patientForm.get('email')?.invalid && patientForm.get('email')?.touched"
                            class="error-message">
                            A valid email is required.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="emergencyContact">Emergency Contact:</label>
                        <input type="text" id="emergencyContact" formControlName="emergencyContact" class="form-control"
                            [readonly]="!canUpdate()" placeholder="Enter Emergency Contact" />
                        <div *ngIf="patientForm.get('emergencyContact')?.invalid && patientForm.get('emergencyContact')?.touched"
                            class="error-message">
                            Emergency Contact is required.
                        </div>
                    </div>

                    <button class="btn btn-danger update-btn" (click)="updatePatient()" [hidden]="!canUpdate()">Update
                        patient</button>

                </form>
            </div>
        </div>
    </div>
    <div><br><br></div>
    <div *ngIf="!canUpdate()">
        <div class="header">
            <h1>Update Patient medical record</h1>
        </div>
        <div style="position:absolute;left:0px;width:100%">
            <app-update-medical-record></app-update-medical-record>
        </div>
    </div>
</div>
