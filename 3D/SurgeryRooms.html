<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Surgery Rooms</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <style>
        body {
            margin: 0;
        }

        #parent {
            position: absolute;
            left: 50.0vw;
        }

        #views-panel {
            position: absolute;
            left: -50.0vmin;
            top: 1vh;
            z-index: 1;
            width: 100.0vmin;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 1.5vmin;
            color: white;
        }

        #help-panel {
            position: absolute;
            left: -50.0vmin;
            top: 20vh;
            z-index: 1;
            width: 100.0vmin;
            font-family: Arial, sans-serif;
            font-size: 1.5vmin;
            color: white;
        }

        #subwindows-panel {
            position: absolute;
            left: -49.0vw;
            bottom: -88.0vh;
            z-index: 1;
            width: 100.0vmin;
            font-family: Arial, sans-serif;
            font-size: 1.5vmin;
            color: white;
        }

        table {
            margin-left: auto;
            margin-right: auto;
            border: 1px solid black;
        }

        table.views {
            background-color: #70707070;
            text-align: right;
        }

        table.help {
            width: 50vmin;
            background-color: #70707050;
        }

        table.subwindows {
            position: absolute;
            background-color: #70707070;
            text-align: right;
        }

        th,
        td {
            overflow: hidden;
            border: 1px solid black;
        }

        a {
            color: white;
        }

        #view,
        #projection {
            width: 18ch;
            font-size: 1.5vmin;
        }

        #horizontal,
        #vertical,
        #distance,
        #zoom {
            width: 10ch;
            font-size: 1.5vmin;
        }

        #reset,
        #reset-all {
            width: 16ch;
            font-size: 1.5vmin;
        }

        input:invalid {
            background-color: pink;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div id="parent">
        <div id="help-panel">
            <table class="help" id="help-table">
                <tr>
                    <th colspan="2" style="font-size: 3.0vmin">
                        Information
                    </th>
                </tr>
                <tr>
                    <th colspan="2" style="text-align: left">Display / hide subwindows</th>
                </tr>
                <tr>
                    <td></td>
                    <td>User interface</td>
                </tr>
                <tr>
                    <td></td>
                    <td>Information</td>
                </tr>
                <tr>
                    <td></td>
                    <td>Statistics</td>
                </tr>
            </table>
        </div>
        <div id="subwindows-panel">
            <table class="subwindows">
                <tr>
                    <td>
                        <label>User interface:</label>
                        <input type="checkbox" id="user-interface">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Information:</label>
                        <input type="checkbox" id="help">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Statistics:</label>
                        <input type="checkbox" id="statistics">
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "./three.js-master/build/three.module.js",
                "three/addons/": "./three.js-master/examples/jsm/"
            }
        }
    </script>
    <script src="./lodash/lodash.js"></script>
    <script type="module">
        import * as THREE from "three";
        import SurgeryRooms from "./surgery_rooms.js";

        let surgeryRooms;

        function initialize() {
            // Create the game
            surgeryRooms = new SurgeryRooms(
                {}, // General Parameters
                {}, // Floor parameters
                {}, // Keys parameters
                { ambientLight: { intensity: 1.0 }, directionalLight: { intensity: 1.0, distance: 20.0, position: new THREE.Vector3(0, 20.0, 0) }}
            );
        }

        function animate() {
            requestAnimationFrame(animate);
            // Update the game
            surgeryRooms.update();
        }

        initialize();
        animate();
    </script>
</body>

</html>
